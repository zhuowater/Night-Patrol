name: Release Desktop Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Upload artifacts to the GitHub Release for the current ref/tag"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact_paths: |
              release/*.AppImage
              release/*.zip
          - name: Windows
            os: windows-latest
            artifact_paths: |
              release/*.exe
              release/*.zip
          - name: macOS
            os: macos-latest
            artifact_paths: |
              release/*.dmg
              release/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 ffmpeg

      - name: Install macOS packaging dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Verify optimized assets are current
        run: npm run assets:optimize -- --check

      - name: Build desktop package
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Night-Patrol-SOC-${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.upload_to_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_paths }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
