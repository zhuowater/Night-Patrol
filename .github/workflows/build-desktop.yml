name: Build Desktop Clients

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            artifact: desktop-linux-x64
            files: |
              release/*.AppImage
              release/*linux*.zip
          - os: macos-latest
            label: macos-arm64
            artifact: desktop-macos-arm64
            files: |
              release/*.dmg
              release/*mac*.zip
          - os: windows-latest
            label: windows-x64
            artifact: desktop-windows-x64
            files: |
              release/*.exe
              release/*win*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        run: npm run desktop:dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          body: |
            ## 夜巡 SOC：边界告警 ${{ github.ref_name }}

            网络安全主题卡牌构筑 roguelike demo 桌面客户端测试包。

            ### 下载

            请按平台下载对应资产：

            - Linux：AppImage 或 linux zip
            - Windows：exe 安装包或 win zip
            - macOS：dmg 或 mac zip

            ### 注意

            - macOS 包目前未做 Apple 公证；如果提示“无法验证开发者”，请右键点击应用并选择“打开”。
            - Windows 包如果触发 SmartScreen，请点击“更多信息” -> “仍要运行”。
            - 当前 demo 仍以核心循环验证为主，数值和平衡还需要更多试玩反馈。
          files: ${{ matrix.files }}
